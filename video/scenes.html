<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Lura promo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=block">
<style>
  :root { --bg:#040912; --green:#34d399; --cyan:#22d3ee; --text:#e6fff5; --dim:#7fa89a; --warm:#fbbf24; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden;
           background:var(--bg); font-family:'Cairo',sans-serif; color:var(--text); transform-origin:0 0; }
  canvas { position:absolute; inset:0; }
  .scene { position:absolute; inset:0; opacity:0; will-change:opacity,transform; }
  .abs { position:absolute; }
  .center { left:50%; top:50%; transform:translate(-50%,-50%); }
  #caption { position:absolute; left:0; right:0; bottom:70px; text-align:center; direction:rtl;
             font-size:60px; font-weight:800; letter-spacing:.5px; text-shadow:0 4px 30px rgba(0,0,0,.9); }
  #caption span { display:inline-block; margin:0 10px; opacity:0; }
  .chip { display:inline-flex; align-items:center; gap:14px; padding:14px 30px; border-radius:999px;
          background:rgba(52,211,153,.12); border:1.5px solid rgba(52,211,153,.6);
          font-size:36px; font-weight:700; direction:rtl; box-shadow:0 0 40px rgba(52,211,153,.25); }
  .dot { width:16px; height:16px; border-radius:50%; background:var(--green); box-shadow:0 0 16px var(--green); }
  .bubble { font-size:210px; font-weight:900; line-height:1; color:#fff;
            text-shadow:0 0 40px rgba(52,211,153,.8), 0 0 90px rgba(34,211,238,.45); }
  .card { width:560px; padding:26px 32px; border-radius:24px; direction:rtl;
          background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
          border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(8px);
          box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .card h4 { font-size:28px; font-weight:600; color:var(--dim); }
  .card .v { font-size:44px; font-weight:800; margin-top:2px; }
  .card .v small { font-family:'Space Grotesk'; font-size:30px; color:var(--dim); margin-inline-start:8px; }
  .bar { height:10px; border-radius:6px; background:rgba(255,255,255,.1); margin-top:14px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:6px;
           background:linear-gradient(90deg,var(--green),var(--cyan)); }
  .win { border-radius:22px; overflow:hidden; background:#0b1422; border:1px solid rgba(255,255,255,.12);
         box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(52,211,153,.1); }
  .win .top { height:46px; background:#101c2e; display:flex; align-items:center; gap:10px; padding:0 18px; }
  .win .top b { width:14px; height:14px; border-radius:50%; background:#334155; }
  .win .top span { margin-inline-start:14px; font:600 20px 'Space Grotesk'; color:var(--dim); }
  .app { width:96px; height:96px; border-radius:26px; display:grid; place-items:center;
         font:700 42px 'Space Grotesk'; color:#fff; box-shadow:0 14px 40px rgba(0,0,0,.4); }
  .term { font:500 30px/1.6 'Space Grotesk',monospace; color:var(--green); padding:26px 32px; direction:ltr; }
  .word { font-family:'Space Grotesk'; font-weight:700; font-size:220px; letter-spacing:-6px; }
  .word span { display:inline-block; opacity:0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>

  <!-- 1  يسمعك ويرد -->
  <div class="scene" id="s1">
  </div>

  <!-- 2  تناديها باسمها -->
  <div class="scene" id="s2">
    <div class="abs bubble" id="name" style="left:280px;top:300px">لورا</div>
    <div class="abs chip" id="chip2" style="left:330px;top:600px"><span class="dot"></span>سمعتك… تفضّل</div>
  </div>

  <!-- 3  كل صباح -->
  <div class="scene" id="s3">
    <div class="abs" id="morning" style="right:180px;top:110px;direction:rtl">
      <div style="font-size:92px;font-weight:900">صباح الخير ☀</div>
      <div style="font-size:34px;color:var(--dim);font-weight:600">تقرير الصباح · جهازك وعملك</div>
    </div>
    <div class="abs card" id="c1" style="right:180px;top:330px"><h4>المعالج</h4><div class="v">14%<small>CPU</small></div><div class="bar"><i data-w="14"></i></div></div>
    <div class="abs card" id="c2" style="right:780px;top:330px"><h4>الذاكرة</h4><div class="v">5.2 / 16<small>GB</small></div><div class="bar"><i data-w="33"></i></div></div>
    <div class="abs card" id="c3" style="right:180px;top:560px"><h4>القرص</h4><div class="v">61%<small>/home</small></div><div class="bar"><i data-w="61"></i></div></div>
    <div class="abs card" id="c4" style="right:780px;top:560px"><h4>عملك على GitHub</h4><div class="v">3 طلبات دمج<small>PRs</small></div><div class="bar"><i data-w="75"></i></div></div>
    <div class="abs card" id="c5" style="right:1380px;top:330px;width:400px"><h4>النظام</h4><div class="v" style="color:var(--green)">محدّث ✓</div></div>
  </div>

  <!-- 4  تفتح برامجك -->
  <div class="scene" id="s4">
    <div class="abs chip" id="chip4" style="right:200px;top:70px"><span class="dot"></span><span id="cmd">افتحي المتصفح</span></div>
    <div class="abs win" id="w1" style="left:250px;top:150px;width:1000px;height:560px">
      <div class="top"><b></b><b></b><b></b><span>Browser</span></div>
      <div id="w1body" style="position:relative;height:514px;background:linear-gradient(135deg,#0f2a3a,#0b1422)">
        <img id="foot" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none">
        <div id="fake" style="padding:50px;direction:rtl">
          <div style="height:46px;width:70%;border-radius:23px;background:rgba(255,255,255,.08)"></div>
          <div style="display:flex;gap:24px;margin-top:40px">
            <div style="flex:1;height:240px;border-radius:18px;background:rgba(52,211,153,.12)"></div>
            <div style="flex:1;height:240px;border-radius:18px;background:rgba(34,211,238,.12)"></div>
            <div style="flex:1;height:240px;border-radius:18px;background:rgba(251,191,36,.10)"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="abs win" id="w2" style="left:1060px;top:330px;width:620px;height:340px">
      <div class="top"><b></b><b></b><b></b><span>Terminal</span></div>
      <div class="term" id="termtxt"></div>
    </div>
    <div class="abs" id="dock" style="left:50%;bottom:200px;transform:translateX(-50%);display:flex;gap:30px;padding:22px 34px;border-radius:40px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)">
      <div class="app" style="background:linear-gradient(135deg,#f97316,#db2777)">◉</div>
      <div class="app" style="background:linear-gradient(135deg,#1e293b,#0f172a);color:var(--green)">&gt;_</div>
      <div class="app" style="background:linear-gradient(135deg,#2563eb,#7c3aed)">{ }</div>
      <div class="app" style="background:linear-gradient(135deg,#0891b2,#0d9488)">▤</div>
      <div class="app" style="background:linear-gradient(135deg,#e11d48,#9333ea)">♪</div>
    </div>
  </div>

  <!-- 5  الشعار -->
  <div class="scene" id="s5">
    <div class="abs word" id="word" style="left:0;right:0;top:400px;text-align:center"><span>L</span><span>u</span><span>r</span><span>a</span></div>
    <div class="abs" id="tag" style="left:0;right:0;top:680px;text-align:center;direction:rtl;font-size:58px;font-weight:800">
      لورا… <span style="color:var(--green)">مساعدتك الصوتية</span> على لينكس</div>
    <div class="abs" id="repo" style="left:0;right:0;top:820px;text-align:center">
      <span class="chip" style="font:600 30px 'Space Grotesk';direction:ltr">github.com/mohamedjs/lura</span></div>
  </div>

  <div id="caption"></div>
</div>

<script src="face_mesh.js"></script>
<script src="face.js"></script>
<script>
// Deterministic: everything on screen is a pure function of t. No CSS animations,
// so a frame grabber can seek anywhere and get the same picture.
const DEFAULT = {fps:30,width:1920,height:1080,total:17.75,scenes:[
  {start:.45,voiceStart:.8,voiceDur:3.2,dur:4.3,text:"تخيّل أنّ جهازك يسمعك… ويردّ عليك"},
  {start:4.75,voiceStart:5.1,voiceDur:2.2,dur:3.3,text:"يكفي أن تناديها باسمها"},
  {start:8.05,voiceStart:8.4,voiceDur:3.8,dur:4.9,text:"وكلَّ صباح، تطمئنك على جهازك… وعلى عملك"},
  {start:12.95,voiceStart:13.3,voiceDur:2.4,dur:3.5,text:"وتفتح لك برامجك بصوتك"},
  {start:16.45,voiceStart:16.8,voiceDur:3.4,dur:5.95,text:"لورا… مساعدتك الصوتية على لينكس"}]};
let TL = DEFAULT;

const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const seg = (t,a,b) => clamp((t-a)/(b-a));
const out3 = p => 1 - Math.pow(1-p, 3);
const inout = p => p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;
const back = p => { const c=1.7; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); };
const noise = (x, s=0) => (Math.sin(x*1.7+s)*.5 + Math.sin(x*3.1+s*2.3)*.3 + Math.sin(x*7.3+s*.7)*.2);
function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }
const R = rng(42), PARTS = Array.from({length:90}, () => ({x:R()*1920, y:R()*1080, r:.6+R()*2.2, v:8+R()*30, a:.2+R()*.6}));

const ctx = $('bg').getContext('2d');
const scenesEl = [1,2,3,4,5].map(i => $('s'+i));

function sceneWindow(i, t) {
  const s = TL.scenes[i], last = i === TL.scenes.length-1;
  const u = t - s.start;
  const pin = out3(seg(u, -0.15, 0.55));
  const pout = last ? 0 : inout(seg(u, s.dur - 0.35, s.dur + 0.25));
  return {u, pin, pout, o: pin*(1-pout), s};
}
// how "loud" the narrator is now: drives waveforms and glow
function voiceLevel(t) {
  for (const s of TL.scenes) if (t >= s.voiceStart && t <= s.voiceStart + s.voiceDur) {
    // real loudness of the narration, one value per frame (render.mjs fills it)
    if (s.env) { const f = (t - s.voiceStart) * TL.fps, i = Math.floor(f), k = f - i;
      return clamp((s.env[i] ?? 0) * (1-k) + (s.env[i+1] ?? 0) * k); }
    const p = (t - s.voiceStart)/s.voiceDur, env = Math.sin(Math.PI*p);
    return clamp(.35 + .65*env*Math.abs(noise(t*9, 3)) + .2*env);
  }
  return 0;
}

function drawBg(t) {
  const W=1920, H=1080, v = voiceLevel(t);
  ctx.clearRect(0,0,W,H);
  const g = ctx.createRadialGradient(960,480,50,960,540,1100);
  g.addColorStop(0,'#0b2030'); g.addColorStop(.55,'#06111d'); g.addColorStop(1,'#020509');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // dawn wash for the morning scene
  const m = sceneWindow(2, t).o;
  if (m > 0) {
    const sun = ctx.createRadialGradient(1500, 1180 - 260*out3(seg(sceneWindow(2,t).u,0,2.5)), 20, 1500, 900, 900);
    sun.addColorStop(0, `rgba(251,191,36,${.55*m})`); sun.addColorStop(.35, `rgba(249,115,22,${.18*m})`); sun.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = sun; ctx.fillRect(0,0,W,H);
  }

  // perspective grid floor
  ctx.save(); ctx.strokeStyle = 'rgba(52,211,153,.10)'; ctx.lineWidth = 1;
  const hz = 700, off = (t*60) % 80;
  for (let i=0;i<14;i++){ const y = hz + Math.pow((i*80+off)/1120, 2)*480; ctx.globalAlpha = clamp((y-hz)/200);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (let i=-20;i<=20;i++){ const vg = ctx.createLinearGradient(0,hz,0,H); vg.addColorStop(0,'rgba(52,211,153,0)'); vg.addColorStop(1,'rgba(52,211,153,.12)'); ctx.strokeStyle = vg; ctx.beginPath(); ctx.moveTo(960+i*40, hz); ctx.lineTo(960+i*220, H); ctx.stroke(); }
  ctx.restore();

  // particles
  for (const p of PARTS) {
    const y = ((p.y - t*p.v) % H + H) % H, x = p.x + Math.sin(t*.5 + p.y)*12;
    ctx.fillStyle = `rgba(110,231,183,${p.a*(.5+.5*Math.sin(t*2+p.x))})`;
    ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fill();
  }

  // scene 1: sound rings + waveform under the head
  const a = sceneWindow(0, t);
  if (a.o > 0) { rings(960, 440, a.u, a.o, 6); wave(960, 860, 1100, a.o, t, v);
    drawFace(ctx, 960, 430, 255*(.85+.15*a.pin), {t, mouth:v, alpha:a.o, glow:v}); }
  // scene 2: ripple from the name when it is called
  const b = sceneWindow(1, t);
  if (b.o > 0) { rings(1410, 450, b.u, b.o*.9, 4); wave(560, 880, 700, b.o, t, v);
    // turns toward the viewer when its name is called
    drawFace(ctx, 1410, 450, 215*(.85+.15*b.pin), {t, mouth:v, alpha:b.o, yaw:-.35*(1-out3(seg(b.u,.3,1))), glow:seg(b.u,1,1.3), hue:'cyan'}); }
  // scene 5: burst behind the logo
  const e = sceneWindow(4, t);
  if (e.o > 0) {
    ctx.save(); ctx.translate(960,240);
    for (let i=0;i<48;i++){ const ang = i/48*Math.PI*2 + e.u*.08, len = 160 + 520*out3(seg(e.u,0,1.4)) + 40*noise(i+e.u,1);
      ctx.strokeStyle = `rgba(52,211,153,${.10*e.o})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(ang)*150, Math.sin(ang)*150); ctx.lineTo(Math.cos(ang)*len, Math.sin(ang)*len); ctx.stroke(); }
    ctx.restore(); rings(960, 240, e.u, e.o*.7, 3);
    drawFace(ctx, 960, 235, 150*(.6+.4*back(seg(e.u,0,.8))), {t, mouth:v, alpha:e.o*out3(seg(e.u,0,.6)), glow:v});
  }
}
function rings(cx, cy, u, o, n) {
  for (let i=0;i<n;i++){ const p = ((u*.45 + i/n) % 1);
    ctx.strokeStyle = `rgba(52,211,153,${(1-p)*.55*o})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, 180 + p*520, 0, 7); ctx.stroke(); }
}
function wave(cx, cy, w, o, t, v) {
  const n = 64, bw = w/n;
  for (let i=0;i<n;i++){
    const d = Math.abs(i - n/2)/(n/2), h = 6 + (14 + 120*v)*(1-d*d)*Math.abs(noise(t*6 + i*.45, i));
    const gr = ctx.createLinearGradient(0, cy-h, 0, cy+h); gr.addColorStop(0,'#22d3ee'); gr.addColorStop(1,'#34d399');
    ctx.fillStyle = gr; ctx.globalAlpha = o*(1-d*.6);
    ctx.fillRect(cx - w/2 + i*bw + 2, cy - h, bw - 4, h*2);
  }
  ctx.globalAlpha = 1;
}

let lastCaption = -1;
function caption(t) {
  const el = $('caption');
  let idx = -1;
  TL.scenes.forEach((s,i) => { if (i < 4 && t >= s.start && t < s.start + s.dur) idx = i; });
  if (idx !== lastCaption) {
    el.innerHTML = idx < 0 ? '' : TL.scenes[idx].text.split(' ').map(w => `<span>${w}</span>`).join(' ');
    lastCaption = idx;
  }
  if (idx < 0) return;
  const s = TL.scenes[idx], spans = el.children, n = spans.length, w = sceneWindow(idx, t);
  for (let k=0;k<n;k++){
    const p = out3(seg(t, s.voiceStart + s.voiceDur*k/n - .1, s.voiceStart + s.voiceDur*k/n + .25));
    spans[k].style.opacity = p * (1 - w.pout);
    spans[k].style.transform = `translateY(${(1-p)*24}px)`;
    spans[k].style.color = p > .99 && t < s.voiceStart + s.voiceDur*(k+1)/n ? '#a7f3d0' : '#fff';
  }
}

const set = (id, css) => Object.assign($(id).style, css);
const pop = (u, a, d=.5) => back(seg(u, a, a+d));

function render(t) {
  drawBg(t);
  TL.scenes.forEach((_, i) => {
    const w = sceneWindow(i, t);
    scenesEl[i].style.opacity = w.o;
    scenesEl[i].style.transform = `scale(${1.04 - .04*w.pin + .03*w.pout})`;
    scenesEl[i].style.filter = w.pout > 0 ? `blur(${w.pout*10}px)` : 'none';
  });
  const v = voiceLevel(t);

  // 1
  let u = sceneWindow(0,t).u;
  // 2
  u = sceneWindow(1,t).u;
  const nameP = pop(u, .35, .6);
  set('name', {transform:`scale(${.4 + .6*nameP})`, opacity:clamp(nameP*1.5)});
  set('chip2', {opacity:out3(seg(u,1.2,1.6)), transform:`translateY(${(1-out3(seg(u,1.2,1.6)))*30}px)`});
  // 3
  u = sceneWindow(2,t).u;
  set('morning', {opacity:out3(seg(u,.1,.6)), transform:`translateY(${(1-out3(seg(u,.1,.6)))*-30}px)`});
  ['c1','c2','c3','c4','c5'].forEach((id,k) => {
    const p = out3(seg(u, .45 + k*.28, 1.05 + k*.28));
    set(id, {opacity:p, transform:`translateY(${(1-p)*60}px) scale(${.92+.08*p})`});
    const bar = $(id).querySelector('i'); if (bar) bar.style.width = (bar.dataset.w * out3(seg(u, .8+k*.28, 2+k*.28))) + '%';
  });
  // 4
  u = sceneWindow(3,t).u;
  set('chip4', {opacity:out3(seg(u,0,.4))});
  $('cmd').textContent = u < 1.55 ? 'افتحي المتصفح' : 'وافتحي الطرفية';
  const w1 = out3(seg(u,.55,1.05)), w2 = back(seg(u,1.75,2.2));
  set('w1', {opacity:w1, transform:`scale(${.3+.7*w1})`, transformOrigin:'40% 120%'});
  set('w2', {opacity:clamp(w2), transform:`scale(${.3+.7*w2})`, transformOrigin:'0% 120%'});
  const cmd = '$ lura run\n✓ wake word: lura\n✓ listening…';
  $('termtxt').textContent = cmd.slice(0, Math.floor(cmd.length*seg(u,2.1,3.2)));
  $('termtxt').style.whiteSpace = 'pre';
  [...$('dock').children].forEach((el,k) => {
    const hit = k===0 ? seg(u,.3,.8) : k===1 ? seg(u,1.5,2) : 0;
    el.style.transform = `translateY(${-Math.sin(hit*Math.PI)*40}px)`;
    el.style.boxShadow = hit>0 && hit<1 ? '0 0 50px rgba(52,211,153,.8)' : '0 14px 40px rgba(0,0,0,.4)';
  });
  // 5
  u = sceneWindow(4,t).u;
  [...$('word').children].forEach((el,k) => { const p = back(seg(u,.35+k*.09,.85+k*.09));
    el.style.opacity = clamp(p); el.style.transform = `translateY(${(1-p)*80}px)`;
    el.style.textShadow = `0 0 ${40+30*v}px rgba(52,211,153,.6)`; });
  set('tag', {opacity:out3(seg(u,.9,1.5)), transform:`translateY(${(1-out3(seg(u,.9,1.5)))*30}px)`});
  set('repo', {opacity:out3(seg(u,1.8,2.4))});
  set('stage', {opacity:1 - seg(t, TL.total - .6, TL.total)});

  caption(t);
  return footage(t);
}

// Optional real screen footage (frames extracted by render.mjs) inside the browser window.
function footage(t) {
  const f = TL.footage; if (!f) return Promise.resolve();
  const u = sceneWindow(3,t).u, img = $('foot');
  img.style.display = 'block'; $('fake').style.display = 'none';
  const n = clamp(Math.floor(Math.max(0,u-.4)*f.fps) + 1, 1, f.count);
  const src = `${f.dir}/f${String(n).padStart(4,'0')}.jpg`;
  if (img.getAttribute('src') === src) return Promise.resolve();
  img.src = src; return img.decode().catch(() => {});
}

window.setup = tl => { TL = tl; lastCaption = -1; };
window.render = render;
window.ready = Promise.all([
  ...['800 60px Cairo','900 200px Cairo','700 100px "Space Grotesk"','500 30px "Space Grotesk"'].map(f => document.fonts.load(f, 'لورا Lura')),
  ...[...document.images].map(i => i.decode().catch(() => {}))]);

// Preview in a normal browser: scale to fit and play in real time.
if (!navigator.webdriver) {
  const fit = () => $('stage').style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/1080)})`;
  addEventListener('resize', fit); fit();
  const t0 = performance.now();
  const loop = () => { render(((performance.now()-t0)/1000) % (TL.total + 1)); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
