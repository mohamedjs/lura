<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* Notebook: cream dotted paper, ink, one marker orange, one highlighter yellow, white paper cards with tape. */
  @font-face { font-family: "Ink"; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Ink"; src: url(fonts/inter-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: "Hand"; src: url(fonts/caveat-latin.woff2) format("woff2"); }
  @font-face { font-family: "ri"; src: url(fonts/remixicon.woff2) format("woff2"); }
  :root { --paper: #F3EEE4; --paper2: #EAE3D5; --card: #FFFFFF; --card2: #FBF8F2; --ink: #1A1714; --mute: #6B6358; --line: #DCD3C2;
          --marker: #E2572B; --hl: #FFD84D; --term: #1F1B17; --mk-tint: #FBE3D8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Ink", sans-serif; color: var(--ink);
    background-color: var(--paper); background-image: radial-gradient(rgba(26,23,20,.12) 1.6px, transparent 1.7px); background-size: 48px 48px; background-position: 24px 24px; }
  .ic { font-family: "ri"; font-style: normal; line-height: 1; }
  .tape { position: absolute; width: 150px; height: 40px; background: rgba(255,255,255,.66); border: 1px solid rgba(26,23,20,.07); box-shadow: 0 2px 6px rgba(70,50,25,.08); }
  .paper { position: absolute; background: var(--card); padding: 14px; border-radius: 4px;
    box-shadow: 0 2px 0 rgba(26,23,20,.05), 0 24px 50px rgba(70,50,25,.18); }

  /* the handwritten section label */
  .label { position: absolute; left: 80px; top: 50px; opacity: 0; transform-origin: 0 50%; }
  .label span { display: inline-block; font-family: "Hand", sans-serif; font-size: 68px; line-height: 1; color: var(--ink); background: var(--card);
    padding: 10px 30px 16px; border-radius: 5px; box-shadow: 0 10px 24px rgba(70,50,25,.16); transform: rotate(-2deg); }
  #marks { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 20; }
  #marks path { fill: none; stroke: var(--marker); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }

  /* tool chips: done ones turn marker orange with a check */
  #tools { position: absolute; right: 80px; top: 54px; display: flex; gap: 18px; opacity: 0; }
  .tool { position: relative; width: 76px; height: 76px; border-radius: 14px; background: var(--card); box-shadow: 0 8px 18px rgba(70,50,25,.14);
    display: grid; place-items: center; font-size: 38px; color: var(--ink); }
  .tool .fill { position: absolute; inset: 0; border-radius: 14px; background: var(--marker); opacity: 0; }
  .tool .ic { position: relative; }
  .tool .ok { position: absolute; right: -9px; bottom: -9px; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 20px; opacity: 0; transform: scale(.4); }

  /* Lura: the hologram on a dark plate in a taped paper frame, as on the landing page */
  #lura { left: 150px; top: 170px; width: 660px; height: 660px; transform-origin: 0 0; }
  #lura .plate { position: relative; width: 100%; height: 100%; border-radius: 3px; overflow: hidden;
    background: radial-gradient(70% 70% at 50% 42%, #2b2621, var(--term) 72%); }
  #lura img { position: absolute; left: 4%; top: 4%; width: 92%; height: 92%; }
  #lura .tape.t1 { left: -34px; top: -10px; transform: rotate(-32deg); }
  #lura .tape.t2 { right: -34px; top: -10px; transform: rotate(32deg); }
  #talk { position: absolute; right: 26px; bottom: 26px; display: flex; gap: 8px; align-items: flex-end; height: 56px; }
  #talk i { width: 12px; height: 56px; border-radius: 6px; background: var(--marker); transform-origin: 50% 100%; transform: scaleY(.18); }
  #name { position: absolute; left: 26px; bottom: 22px; font-family: "Hand", sans-serif; font-size: 52px; color: #F3EEE4; }

  /* the screen card: real footage from the session, or the board she reads out */
  #screen { left: 640px; top: 166px; width: 1210px; height: 760px; opacity: 0; transform-origin: 50% 50%; }
  #screen .win { position: relative; width: 1182px; height: 732px; overflow: hidden; border-radius: 3px; background: var(--term); }
  #screen .tape.t1 { left: 50%; top: -20px; margin-left: -75px; transform: rotate(-2deg); }
  .shot { position: absolute; inset: 0; opacity: 0; }
  .shot video { position: absolute; left: 0; width: 1182px; }
  .board { position: absolute; inset: 0; opacity: 0; background-color: var(--card2);
    background-image: radial-gradient(rgba(26,23,20,.10) 1.4px, transparent 1.5px); background-size: 36px 36px; padding: 40px 46px; }
  .board h3 { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 800; margin-bottom: 30px; }
  .board h3 .ic { font-size: 50px; }
  .board h3 small { margin-left: auto; font-family: "Hand", sans-serif; font-weight: 400; font-size: 42px; color: var(--mute); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .card { display: flex; align-items: center; gap: 20px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 20px 24px; box-shadow: 0 10px 22px rgba(70,50,25,.12); opacity: 0; }
  .card .ic { flex: none; width: 66px; height: 66px; border-radius: 12px; background: var(--mk-tint); color: var(--marker); display: grid; place-items: center; font-size: 36px; }
  .card b { display: block; font-size: 31px; font-weight: 800; line-height: 1.15; }
  .card small { display: block; font-size: 23px; color: var(--mute); margin-top: 4px; }
  .card.wide { grid-column: 1 / span 2; }

  /* intro */
  #intro { position: absolute; left: 900px; top: 150px; width: 940px; }
  #intro h1 { font-size: 66px; font-weight: 800; line-height: 1.12; opacity: 0; }
  .hlw { position: relative; display: inline-block; z-index: 0; isolation: isolate; }
  .hlw i { position: absolute; left: -6px; right: -6px; top: 22%; bottom: 4%; background: var(--hl); border-radius: 6px; z-index: -1; transform: scaleX(0) skewX(-8deg); transform-origin: 0 50%; }
  #intro .grid { margin-top: 44px; }

  /* outro */
  #outro { position: absolute; left: 900px; top: 170px; width: 960px; opacity: 0; }
  #outro .big { font-size: 170px; font-weight: 800; line-height: .95; letter-spacing: -4px; }
  #outro .sub { font-size: 44px; font-weight: 800; margin-top: 18px; }
  #outro .row { display: flex; gap: 16px; margin-top: 36px; }
  .chip { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 26px;
    font-size: 30px; font-weight: 800; box-shadow: 0 8px 18px rgba(70,50,25,.10); }
  .chip .ic { font-size: 32px; }
  .chip.mk { background: var(--marker); border-color: var(--marker); color: #fff; }
  #outro .url { margin-top: 30px; font-size: 34px; color: var(--mute); }
  #sticky { position: absolute; left: 1400px; top: 560px; width: 450px; background: var(--hl); padding: 30px 34px 26px; opacity: 0;
    box-shadow: 0 16px 32px rgba(70,50,25,.22); transform-origin: 50% 0; }
  #sticky .tape { left: 50%; top: -20px; margin-left: -75px; transform: rotate(-3deg); }
  #sticky p { font-family: "Hand", sans-serif; font-size: 44px; line-height: 1.12; }
  #sticky p b { font-family: "Ink", sans-serif; font-weight: 800; font-size: 34px; display: block; margin-bottom: 6px; }

  /* captions: the narration, with the highlighter on key words */
  .cap { position: absolute; left: 110px; right: 110px; top: 1010px; text-align: center; transform: translateY(-50%); opacity: 0; z-index: 10; }
  .cap .strip { display: inline-block; background: var(--card); padding: 10px 28px 14px; border-radius: 6px; box-shadow: 0 10px 26px rgba(70,50,25,.18);
    font-weight: 800; font-size: 36px; line-height: 1.32; color: var(--ink); transform: rotate(-.6deg); max-width: 1640px; }
  .w { position: relative; display: inline-block; z-index: 0; isolation: isolate; }
  .w i { position: absolute; left: -4px; right: -4px; top: 20%; bottom: 4%; background: var(--hl); border-radius: 5px; transform: scaleX(0) skewX(-8deg); transform-origin: 0 50%; z-index: -1; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
  <audio id="voice" class="clip" src="audio/mix.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" data-has-audio="true"></audio>
  <div id="labels"></div>
  <div id="tools"></div>
  <div class="paper" id="lura"><div class="plate"><img src="img/holo-hero.webp" alt=""><div id="name">Lura</div><div id="talk"><i></i><i></i><i></i><i></i></div></div>
    <i class="tape t1"></i><i class="tape t2"></i></div>
  <div id="intro"><h1>A voice assistant on <span class="hlw"><i></i>your computer.</span></h1><div class="grid" id="introcards"></div></div>
  <div class="paper" id="screen"><div class="win" id="win">
  {{CLIPS}}
  </div><i class="tape t1"></i></div>
  <div id="outro">
    <div class="big">Lura</div>
    <div class="sub">Your voice assistant, in Arabic &amp; English.</div>
    <div class="row"><span class="chip"><i class="ic">&#xf2c7;</i>Windows</span><span class="chip"><i class="ic">&#xea3f;</i>macOS</span><span class="chip"><i class="ic">&#xf240;</i>Linux</span></div>
    <div class="row"><span class="chip mk"><i class="ic">&#xefb3;</i>Free &amp; open source · MIT</span></div>
    <div class="url">mohamedjs.github.io/lura</div>
  </div>
  <div id="sticky"><i class="tape"></i><p><b>Built with AI.</b>Idea, architecture, decisions &amp; release: Mohamed Mahmoud</p></div>
  <svg id="marks" viewBox="0 0 1920 1080"></svg>
  <div id="caps"></div>
</div>
<script>
  const D = {{DATA}};
  const $ = s => document.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const ico = cp => `<i class="ic">&#x${cp};</i>`;
  const tl = gsap.timeline({ paused: true });
  const S = Object.fromEntries(D.secs.map(s => [s.id, s]));
  const TOOLS = { folder: "ed53", gemini: "f36a", notion: "f348", github: "edca" };

  // --- build the DOM from the data (deterministic) ---
  Object.entries(TOOLS).forEach(([k, cp]) => $("#tools").appendChild(el("div", "tool", `<span class="fill"></span>${ico(cp)}<span class="ok ic">&#xeb7b;</span>`)).id = "tool-" + k);
  D.secs.forEach(s => { if (s.label) $("#labels").appendChild(el("div", "label", `<span>${s.label}</span>`)).id = "lb-" + s.id; });
  const win = $("#win");
  D.secs.forEach(s => {
    if (!s.clip) return;
    const v = $("#v_" + s.id), shot = el("div", "shot"); shot.id = "shot-" + s.id;
    win.insertBefore(shot, v); shot.appendChild(v);
    const h = 1182 / s.aspect; v.style.height = h + "px"; v.style.top = ((732 - h) / 2) + "px";
    if (s.board) {
      const title = s.id === "notion" ? ["f348", "Notion", "last edited"] : ["edca", "GitHub", "latest activity"];
      const b = el("div", "board", `<h3>${ico(title[0])}${title[1]}<small>${title[2]}</small></h3><div class="grid"></div>`); b.id = "board-" + s.id;
      win.appendChild(b);
    }
  });
  D.cards.forEach((c, k) => {
    const card = el("div", "card", `${ico(c.icon)}<div><b>${c.title}</b>${c.sub ? `<small>${c.sub}</small>` : ""}</div>`); card.id = "card" + k;
    if (c.sec === "notion" && k === D.cards.findIndex(x => x.sec === "notion")) card.classList.add("wide");
    (c.sec === "intro" ? $("#introcards") : $(`#board-${c.sec} .grid`)).appendChild(card);
  });
  D.caps.forEach((c, k) => {
    const cap = el("div", "cap", `<span class="strip">${c.words.map((w, j) => `<span class="w" id="w${k}_${j}">${w.hl ? "<i></i>" : ""}${w.w}</span>${w.p}`).join(" ")}</span>`);
    cap.id = "cap" + k; $("#caps").appendChild(cap);
  });

  // --- Lura's frame: big in the intro, beside the screen during the tasks, big again at the end ---
  const LURA = { big: { x: 0, y: 0, scale: 1 }, side: { x: -80, y: 90, scale: .76 }, end: { x: 0, y: 30, scale: .96 } };
  tl.set("#lura", LURA.big, 0);
  tl.fromTo("#lura", { y: 40, rotation: -3, opacity: 0 }, { y: 0, rotation: -1, opacity: 1, duration: .7, ease: "back.out(1.5)" }, .05);
  tl.to("#lura", { ...LURA.side, rotation: -1.5, duration: .7, ease: "power3.inOut" }, S.folder.start - .2);
  tl.to("#lura", { ...LURA.end, rotation: -1, duration: .7, ease: "power3.inOut" }, S.outro.start - .1);
  tl.fromTo("#lura img", { y: 0 }, { y: -12, duration: 3, ease: "sine.inOut", repeat: Math.floor(D.total / 3), yoyo: true }, 0);

  // she "talks" while the narrator does: four bars that bounce
  D.talk.forEach(([a, b]) => {
    document.querySelectorAll("#talk i").forEach((bar, j) => {
      const d = .16 + j * .035, reps = Math.max(1, Math.floor((b - a) / d) - 1);
      tl.fromTo(bar, { scaleY: .18 }, { scaleY: .55 + .4 * ((j * 7) % 4) / 3, duration: d, ease: "sine.inOut", repeat: reps | 1, yoyo: true }, a + j * .03);
      tl.to(bar, { scaleY: .18, duration: .15 }, b + .05);
    });
  });

  // --- section labels with a marker underline ---
  const SVGNS = "http://www.w3.org/2000/svg", marks = $("#marks");
  const stroke = (d, at, out, dur = .5) => {
    const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d); marks.appendChild(p);
    const len = p.getTotalLength(); p.style.strokeDasharray = len;
    tl.set(p, { opacity: 0, strokeDashoffset: len }, 0);
    tl.set(p, { opacity: 1 }, at);
    tl.to(p, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
    if (out) tl.to(p, { opacity: 0, duration: .2 }, out);
  };
  D.secs.forEach(s => {
    if (!s.label) return;
    const lb = "#lb-" + s.id;
    tl.fromTo(lb, { scale: .6, rotation: 6, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .45, ease: "back.out(2)" }, s.start + .1);
    tl.to(lb, { opacity: 0, y: -16, duration: .25 }, s.end - .3);
    const w = s.label.length * 30 + 60;
    stroke(`M 92 ${150} C ${92 + w * .35} ${158} ${92 + w * .7} ${146} ${80 + w} ${152}`, s.start + .45, s.end - .3);
  });

  // --- intro: headline, highlighter, capability cards ---
  tl.fromTo("#intro h1", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "power3.out" }, .5);
  tl.to("#intro .hlw i", { scaleX: 1, duration: .45, ease: "power2.out" }, 1.1);
  tl.to("#intro", { opacity: 0, x: 40, duration: .35 }, S.intro.end - .4);

  // --- the tool row, and a tick when each task is done ---
  tl.fromTo("#tools", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: .4 }, S.folder.start);
  tl.to("#tools", { opacity: 0, duration: .3 }, S.outro.start - .2);
  Object.keys(TOOLS).forEach(k => {
    const s = S[k];
    tl.fromTo(`#tool-${k}`, { scale: 1 }, { scale: 1.12, duration: .25, yoyo: true, repeat: 1 }, s.start + .2);
    tl.to(`#tool-${k} .fill`, { opacity: 1, duration: .25 }, s.end - .55);
    tl.to(`#tool-${k} .ic:not(.ok)`, { color: "#fff", duration: .25 }, s.end - .55);
    tl.to(`#tool-${k} .ok`, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2.5)" }, s.end - .55);
    // a hand-drawn check on the screen card's corner
    stroke("M 1738 930 L 1768 962 L 1830 884", s.end - .6, s.end - .05, .35);
  });

  // --- the screen card, and what is in it ---
  tl.fromTo("#screen", { x: 60, rotation: 2, opacity: 0 }, { x: 0, rotation: .6, opacity: 1, duration: .55, ease: "power3.out" }, S.folder.start + .05);
  tl.to("#screen", { opacity: 0, y: 30, duration: .35 }, S.outro.start - .25);
  D.secs.forEach(s => {
    if (!s.clip) return;
    const shot = "#shot-" + s.id;
    tl.set(shot, { opacity: 0 }, 0);
    tl.to(shot, { opacity: 1, duration: .25 }, s.start);
    tl.fromTo(shot + " video", { scale: 1.06 }, { scale: 1, duration: Math.min(s.clipdur, s.end - s.start), ease: "none" }, s.start);
    tl.to(shot, { opacity: 0, duration: .25 }, s.board ? s.start + s.clipdur - .1 : s.end - .05);
    if (s.board) {
      tl.set("#board-" + s.id, { opacity: 0 }, 0);
      tl.fromTo("#board-" + s.id, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .35 }, s.start + s.clipdur - .3);
      tl.to("#board-" + s.id, { opacity: 0, duration: .25 }, s.end - .05);
    }
  });
  D.cards.forEach((c, k) => {
    const s = S[c.sec];
    const at = s.board ? Math.max(c.at, s.start + s.clipdur + .1) : c.at;
    tl.fromTo("#card" + k, { scale: .7, y: 18, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: .4, ease: "back.out(2)" }, at);
  });

  // --- outro ---
  tl.fromTo("#outro", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: .55, ease: "power3.out" }, S.outro.start + .2);
  tl.fromTo("#sticky", { scale: .7, rotation: 9, opacity: 0 }, { scale: 1, rotation: 3, opacity: 1, duration: .5, ease: "back.out(1.8)" }, S.outro.start + 1.4);
  stroke("M 905 418 C 1000 432 1110 426 1205 414", S.outro.start + .8, null, .5);

  // --- captions ---
  D.caps.forEach((c, k) => {
    tl.set("#cap" + k, { opacity: 0 }, 0);
    tl.fromTo("#cap" + k, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: .18, ease: "power2.out" }, c.at - .1);
    tl.to("#cap" + k, { opacity: 0, duration: .15 }, c.end + .2);
    c.words.forEach((w, j) => { if (w.hl) tl.to(`#w${k}_${j} i`, { scaleX: 1, duration: .2, ease: "power2.out" }, w.at); });
  });

  tl.set({}, {}, D.total);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
