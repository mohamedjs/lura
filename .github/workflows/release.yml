# Builds Lura for Linux (.deb + tar.gz), macOS (.app zip, arm64 + Intel) and
# Windows (installer .exe), installs and runs each build on its runner and
# takes screenshots. On a tag like v2.0.0 it also publishes a GitHub Release
# and updates the Homebrew tap; on claude/** branches the builds are only
# downloadable artifacts of the run. A manual run (workflow_dispatch with a
# version) publishes the release too, creating the tag on the built commit.
#
# Optional configuration (Settings → Secrets and variables → Actions):
#   vars.LS_STORE_ID, vars.LS_PRODUCT_ID, vars.CHECKOUT_URL  Lemon Squeezy store for Pro
#   secrets.HOMEBREW_TAP_TOKEN  a token that can push to mohamedjs/homebrew-lura
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), e.g. 2.0.0"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          CODE=$(grep -oP '__version__ = "\K[^"]+' src/lura/__init__.py)
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          [ -n "$V" ] || V="$CODE"   # branch builds use the code's version
          if [ "$V" != "$CODE" ]; then
            echo "::error::Tag $V does not match __version__ $CODE in src/lura/__init__.py"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libcairo2-dev pkg-config
      - run: pip install -e ".[anthropic]" pycairo
      - run: python tests/run_all.py && python -m lura.modules.overlay

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libcairo2-dev pkg-config xvfb imagemagick \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxkbcommon-x11-0 libegl1
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - name: Pro store configuration
        shell: python
        env:
          LS_STORE_ID: ${{ vars.LS_STORE_ID }}
          LS_PRODUCT_ID: ${{ vars.LS_PRODUCT_ID }}
          CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
        run: |
          import json, os, pathlib
          p = pathlib.Path("src/lura/modules/billing/store.json")
          data = json.loads(p.read_text())
          if os.environ.get("LS_STORE_ID"): data["store_id"] = int(os.environ["LS_STORE_ID"])
          if os.environ.get("LS_PRODUCT_ID"): data["product_id"] = int(os.environ["LS_PRODUCT_ID"])
          if os.environ.get("CHECKOUT_URL"): data["checkout_url"] = os.environ["CHECKOUT_URL"]
          p.write_text(json.dumps(data, indent=2) + "\n")
          print("store_id set" if data["store_id"] else "WARNING: no store_id — any Lemon Squeezy key unlocks Pro")

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" pyinstaller pillow

      - name: Checks on this OS
        run: python tests/run_all.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/lura.spec

      - name: Smoke test the build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then dist/Lura.app/Contents/MacOS/lura --version
          elif [ "$RUNNER_OS" = "Windows" ]; then dist/lura/lura.exe --version
          else dist/lura/lura --version; fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh "$VERSION" amd64
          tar -C dist -czf "dist/lura-$VERSION-linux-x86_64.tar.gz" lura
          mkdir -p out && cp dist/*.deb dist/*.tar.gz out/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH="${{ matrix.target }}"; ARCH="${ARCH#macos-}"
          mkdir -p out
          ditto -c -k --keepParent dist/Lura.app "out/Lura-$VERSION-macos-$ARCH.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\lura.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\Lura-Setup-$env:VERSION.exe" out\
          Compress-Archive -Path dist\lura\* -DestinationPath "out\lura-$env:VERSION-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

      # Install / run / screenshot. Runner desktops differ from real ones (no
      # audio device, no compositor on Linux), so this never blocks a release;
      # read its log and screenshots.
      - name: Smoke test — install, run, screenshot (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: packaging/ci/smoke-windows.ps1 -Version $env:VERSION
      - name: Smoke test — run, screenshot (Linux, macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: packaging/ci/smoke-unix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.target }}
          path: screenshots/*
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true, pattern: "[!s]*" }
      - run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          # A manual run creates the tag here, on the commit it built.
          target_commitish: ${{ github.sha }}
          name: Lura ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install
            - **Ubuntu / Debian:** download `lura_${{ env.VERSION }}_amd64.deb`, then `sudo apt install ./lura_${{ env.VERSION }}_amd64.deb`
            - **macOS:** `brew install --cask mohamedjs/lura/lura`
            - **Windows:** run `Lura-Setup-${{ env.VERSION }}.exe`
            - **Other Linux:** unpack `lura-${{ env.VERSION }}-linux-x86_64.tar.gz` and run `lura/LuraApp`

            The built-in Chrome, web and files connectors need Node.js (npx).

  homebrew:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true, pattern: "macos-*" }
      - name: Update the tap
        if: env.TAP_TOKEN != ''
        run: |
          ARM=$(sha256sum "artifacts/Lura-$VERSION-macos-arm64.zip" | cut -d' ' -f1)
          X86=$(sha256sum "artifacts/Lura-$VERSION-macos-x86_64.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mohamedjs/homebrew-lura.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA_ARM64@/$ARM/" -e "s/@SHA_X86_64@/$X86/" \
            packaging/homebrew/lura.rb.tmpl > tap/Casks/lura.rb
          cd tap
          git config user.name "lura-release"
          git config user.email "release@users.noreply.github.com"
          git add Casks/lura.rb
          git commit -m "lura $VERSION" && git push
      - name: No tap token
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated."

  # Branch builds only: keep the smoke-test screenshots in the repo
  # (docs/screenshots/<platform>/), where they document what each build looks like.
  screenshots:
    if: always() && github.ref_type == 'branch' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/download-artifact@v4
        with: { path: shots, pattern: "screenshots-*" }
      - name: Commit screenshots
        run: |
          [ -d shots ] || { echo "no screenshots"; exit 0; }
          for dir in shots/screenshots-*; do
            target="${dir#shots/screenshots-}"
            mkdir -p "docs/screenshots/$target"
            cp "$dir"/*.png "docs/screenshots/$target/" 2>/dev/null || true
          done
          git add docs/screenshots
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git config user.name "lura-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -m "docs: screenshots from CI run ${{ github.run_id }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
