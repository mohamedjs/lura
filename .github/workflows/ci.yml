name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libcairo2-dev pkg-config
      - name: Install
        run: pip install -e ".[anthropic]" pycairo
      - name: Compile
        run: python -m compileall -q src/
      - name: Checks
        run: python tests/run_all.py
      - name: Overlay self-check
        run: python -m lura.modules.overlay
      - name: CLI wires up
        run: lura --help && lura --version
