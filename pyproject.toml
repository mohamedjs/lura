[project]
name = "lura"
version = "1.0.0"
description = "Wake-word voice assistant — Gemini Live or OpenRouter"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
    "numpy>=1.26",
]

[project.scripts]
lura = "lura.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
